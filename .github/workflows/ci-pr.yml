name: Validate pull requests (Android and catalog)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'catalog-service/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'firebase.ci.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/actions/setup-firebase/**'
      - '.github/workflows/ci-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      GCLOUD_PROJECT: demo-no-project
      GOOGLE_CLOUD_PROJECT: demo-no-project
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install verified Firebase CLI
        uses: ./.github/actions/setup-firebase
      - name: Prepare temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test ! -e debug.keystore
          keytool -genkeypair -keystore debug.keystore -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Quadrinheiro CI,O=Android,C=US'
      - name: Run catalog security and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test catalog-service/test/*.test.cjs
      - name: Discover Android unit test task
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          gradle :app:tasks --all --no-daemon --console=plain | tee ci-reports/app-tasks.txt
          task=$(awk '$1 ~ /^testDebug(UnitTest|HostTest)$/ {print $1; exit}' ci-reports/app-tasks.txt)
          test -n "$task" || { echo '::error::No compatible debug unit test task found'; exit 1; }
          echo "TEST_TASK=$task" >> "$GITHUB_ENV"
      - name: Run unit and Firebase emulator tests and build APKs
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-no-project --config firebase.ci.json --only auth,firestore --non-interactive "gradle :app:$TEST_TASK :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain"
      - name: Enable Android emulator acceleration
        shell: bash
        run: sudo chmod 666 /dev/kvm
      - name: Validate AGSL, backdrop draw work and glass interactions on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.LiquidGlassRuntimeShaderDeviceTest,com.example.BackdropDrawWorkTest,com.example.FluidControlsTest --no-daemon --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ci-reports/
            app/build/reports/tests/
            app/build/test-results/
            firebase-debug.log
            firestore-debug.log
      - name: Delete temporary signing material
        if: always()
        shell: bash
        run: rm -f debug.keystore
