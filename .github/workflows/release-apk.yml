name: Build signed APK and publish update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'firebase.ci.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/actions/setup-firebase/**'
      - '.github/scripts/configure_android_release.py'
      - '.github/workflows/release-apk.yml'

permissions:
  contents: write

concurrency:
  group: signed-apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install fixed and verified Firebase CLI without npm
        uses: ./.github/actions/setup-firebase
      - name: Require permanent signing secrets
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEY_B64" && test -n "$KEY_PASSWORD" || { echo '::error::Cadastre ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD nos Repository Secrets antes de gerar o primeiro APK.'; exit 1; }
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/quadrinheiro-release.p12"
          keytool -exportcert -keystore "$RUNNER_TEMP/quadrinheiro-release.p12" -storetype PKCS12 -alias upload -storepass:env KEY_PASSWORD > "$RUNNER_TEMP/release-cert.der"
          actual=$(sha256sum "$RUNNER_TEMP/release-cert.der" | cut -d' ' -f1)
          expected=$(tr -d '\r\n ' < docs/release-signing-sha256.txt)
          test "$actual" = "$expected" || { echo '::error::A chave não corresponde ao certificado permanente do aplicativo.'; exit 1; }
      - name: Optional Firebase client configuration
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_JSON" ]; then printf '%s' "$GOOGLE_JSON" | base64 --decode > app/google-services.json; fi
      - name: Integrate updater and release version inputs
        run: python3 .github/scripts/configure_android_release.py
      - name: Version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Discover tests and assemble signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/quadrinheiro-release.p12
          KEYSTORE_TYPE: PKCS12
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          mkdir -p ci-reports
          args=(-PreleaseVersionCode="$VERSION_CODE" -PreleaseVersionName="$VERSION_NAME" --no-daemon --console=plain)
          gradle :app:tasks --all "${args[@]}" | tee ci-reports/app-tasks.txt
          task=$(awk '$1 ~ /^testRelease(UnitTest|HostTest)$/ {print $1; exit}' ci-reports/app-tasks.txt)
          if [ -z "$task" ]; then task=$(awk '$1 ~ /^testDebug(UnitTest|HostTest)$/ {print $1; exit}' ci-reports/app-tasks.txt); fi
          if [ -z "$task" ]; then task=$(awk '$1 == "test" {print $1; exit}' ci-reports/app-tasks.txt); fi
          if [ -z "$task" ]; then echo '::error::Nenhuma tarefa de testes compatível foi encontrada.'; exit 1; fi
          echo "Tarefa de testes selecionada: :app:$task" | tee ci-reports/selected-tests.txt
          echo "Test task selected: :app:$task; local Auth/Firestore emulators; production rules unchanged." >> "$GITHUB_STEP_SUMMARY"
          firebase emulators:exec --project demo-no-project --config firebase.ci.json --only auth,firestore --non-interactive "gradle :app:$task :app:assembleRelease -PreleaseVersionCode=$VERSION_CODE -PreleaseVersionName=$VERSION_NAME --no-daemon --console=plain"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-diagnostics-${{ github.run_number }}
          path: |
            ci-reports/
            app/build/reports/tests/
            app/build/test-results/
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: ignore
      - name: Verify APK and create update manifest
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/quadrinheiro.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs dist/quadrinheiro.apk > "$RUNNER_TEMP/apk-verification.txt"
          cat "$RUNNER_TEMP/apk-verification.txt"
          python3 - <<'PY'
          import os, json, hashlib, re
          from pathlib import Path
          report = (Path(os.environ['RUNNER_TEMP']) / 'apk-verification.txt').read_text()
          expected = Path('docs/release-signing-sha256.txt').read_text().strip().lower()
          if not re.fullmatch(r'[a-f0-9]{64}', expected):
              raise SystemExit('Invalid pinned signing certificate fingerprint')
          signer_counts = re.findall(r'^Number of signers:\s*(\d+)\s*$', report, re.M)
          if signer_counts != ['1']:
              raise SystemExit('APK must have exactly one verified signer')
          fingerprints = {value.lower() for value in re.findall(
              r'^(?:Signer #\d+|V\d+(?:\.\d+)* Signer): certificate SHA-256 digest:\s*([0-9a-fA-F]{64})\s*$',
              report, re.M
          )}
          if fingerprints != {expected}:
              raise SystemExit('APK certificate missing, unrecognized, or different from the permanent signing key')
          apk = Path('dist/quadrinheiro.apk')
          metadata = {
              'applicationId': 'com.aistudio.quadrinheiro.lqglas',
              'versionCode': int(os.environ['VERSION_CODE']),
              'versionName': os.environ['VERSION_NAME'],
              'minSdk': 24,
              'certificateSha256': expected,
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'apkUrl': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/download/' + os.environ['RELEASE_TAG'] + '/quadrinheiro.apk',
              'sourceCommit': os.environ['GITHUB_SHA']
          }
          Path('dist/update.json').write_text(json.dumps(metadata, indent=2) + '\n')
          Path('dist/SHA256SUMS.txt').write_text(metadata['sha256'] + '  quadrinheiro.apk\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Quadrinheiro-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error
      - name: Publish immutable public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo '::error::Esta versão já foi publicada. Não sobrescrever APKs de uma versão existente.'; exit 1; fi
          if gh release view --json tagName --jq .tagName > "$RUNNER_TEMP/latest-tag.txt" 2>/dev/null; then
            latest=$(cat "$RUNNER_TEMP/latest-tag.txt")
            if [[ "$latest" =~ ^v1\.0\.([0-9]+)$ ]]; then test "$GITHUB_RUN_NUMBER" -gt "${BASH_REMATCH[1]}" || { echo '::error::Não publicar versão anterior à atual.'; exit 1; }; fi
          fi
          gh release create "$RELEASE_TAG" dist/quadrinheiro.apk dist/update.json dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Quadrinheiro $VERSION_NAME" --generate-notes
      - name: Delete temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/quadrinheiro-release.p12" "$RUNNER_TEMP/release-cert.der" app/google-services.json
