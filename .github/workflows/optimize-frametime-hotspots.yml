name: Validate frametime hotspot optimizations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/optimize_frametime_hotspots.py'
      - '.github/workflows/optimize-frametime-hotspots.yml'

permissions:
  contents: write

concurrency:
  group: frametime-hotspots-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: ./.github/actions/setup-firebase
      - name: Apply bounded frametime patches
        run: python3 .github/scripts/optimize_frametime_hotspots.py
      - name: Run unit tests and compilation with isolated Firebase
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          firebase emulators:exec --project demo-no-project --config firebase.ci.json --only auth,firestore --non-interactive "gradle :app:testDebugUnitTest :app:compileDebugKotlin --no-daemon --console=plain"
      - name: Commit validated changes
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/components/AmbientImageProcessor.kt app/src/main/java/com/example/ui/screens/MainTabsScreens.kt .audit/frametime_hotspots_v17.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: reduce ambient color extraction thread hops and cache list item metadata'
          git push origin HEAD:main
