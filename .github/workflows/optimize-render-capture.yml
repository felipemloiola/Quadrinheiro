name: Validate render capture optimization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/optimize_render_capture.py'
      - '.github/workflows/optimize-render-capture.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: render-capture-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: ./.github/actions/setup-firebase
      - name: Stage reviewed render changes
        run: python3 .github/scripts/optimize_render_capture.py
      - name: Unit tests with isolated Firebase
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          firebase emulators:exec --project demo-no-project --config firebase.ci.json --only auth,firestore --non-interactive "gradle :app:testDebugUnitTest :app:compileDebugKotlin --no-daemon --console=plain"
      - name: Prepare disposable CI-only debug signing key and emulator access
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 365 -noprompt
            echo 'CI_CREATED_DEBUG_KEY=true' >> "$GITHUB_ENV"
          fi
          test -e /dev/kvm || { echo '::error::Hardware virtualization unavailable; visual tests cannot be skipped.'; exit 1; }
          sudo chmod a+rw /dev/kvm
      - name: Android pixel-equivalence and touch regression tests (not FPS benchmarks)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.RenderLayerEquivalenceTest --no-daemon --console=plain
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-capture-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            firebase-debug.log
            firestore-debug.log
            .audit/render_capture_v16.txt
          if-no-files-found: ignore
      - name: Commit only validated render changes
        id: commit
        run: |
          git fetch origin main
          latest=$(git rev-parse origin/main)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            git diff --quiet "$GITHUB_SHA" "$latest" -- app gradle build.gradle.kts settings.gradle.kts gradle.properties firebase.ci.json firebase.json firestore.rules firestore.indexes.json .github/scripts .github/workflows .github/actions || { echo '::error::O código mudou durante a validação. Execute novamente na main atual; não será sobrescrito.'; exit 1; }
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kyant/backdrop/backdrops/LayerBackdrop.kt app/src/main/java/com/kyant/backdrop/backdrops/LayerBackdropModifier.kt app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/ui/components/CatalogModal.kt app/src/androidTest/java/com/example/RenderLayerEquivalenceTest.kt .audit/render_capture_v16.txt
          if git diff --cached --quiet; then echo 'publish=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m 'perf: validated single-pass default backdrop capture'
          if [ "$latest" != "$GITHUB_SHA" ]; then git rebase "$latest"; fi
          git push origin HEAD:main
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Generate a new signed APK after successful validation
        if: steps.commit.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-apk.yml --ref main
      - name: Remove disposable CI debug key
        if: always()
        run: |
          if [ "${CI_CREATED_DEBUG_KEY:-false}" = true ]; then rm -f debug.keystore; fi
