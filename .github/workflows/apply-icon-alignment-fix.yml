name: Validate and apply icon and alignment fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_icon_and_alignment_fix.py'
      - '.github/workflows/apply-icon-alignment-fix.yml'
      - 'app/src/main/res/drawable/ic_launcher_background.xml'

permissions:
  contents: write
  actions: write

concurrency:
  group: icon-alignment-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: ./.github/actions/setup-firebase
      - name: Apply icon and brand alignment fixes
        run: python3 .github/scripts/apply_icon_and_alignment_fix.py
      - name: Run unit tests and compilation with isolated Firebase
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          firebase emulators:exec --project demo-no-project --config firebase.ci.json --only auth,firestore --non-interactive "gradle :app:testDebugUnitTest :app:compileDebugKotlin --no-daemon --console=plain"
      - name: Commit validated icon and alignment fixes
        id: commit
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable/ic_launcher_background.xml app/src/main/java/com/example/ui/components/SocialShareCardSheet.kt app/src/main/java/com/example/ui/screens/WelcomeIntroScreen.kt .audit/ui_perfect_alignment_v22.txt
          if git diff --cached --quiet; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'style: enforce solid pure black launcher icon background and perfect center alignment of share brand mark'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Trigger release APK build after successful patch
        if: steps.commit.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-apk.yml --ref main
