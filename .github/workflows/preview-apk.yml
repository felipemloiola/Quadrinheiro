name: Signed preview for device testing
on:
  push:
    branches: [fix/storage-discovery-profile]
    paths: ['.github/workflows/preview-apk.yml']
permissions:
  contents: write
concurrency:
  group: signed-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'felipemloiola/Quadrinheiro' && github.ref == 'refs/heads/fix/storage-discovery-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: ./.github/actions/setup-firebase
      - name: Prepare permanent signing and Firebase configuration
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/quadrinheiro-release.p12"
          keytool -exportcert -keystore "$RUNNER_TEMP/quadrinheiro-release.p12" -storetype PKCS12 -alias upload -storepass:env KEY_PASSWORD > "$RUNNER_TEMP/release-cert.der"
          test "$(sha256sum "$RUNNER_TEMP/release-cert.der" | cut -d' ' -f1)" = "$(tr -d '\r\n ' < docs/release-signing-sha256.txt)"
          if [ -n "$GOOGLE_JSON" ]; then printf '%s' "$GOOGLE_JSON" | base64 --decode > app/google-services.json; fi
          node --test .github/scripts/validate_google_services.test.cjs
          node .github/scripts/validate_google_services.cjs app/google-services.json "$RUNNER_TEMP/release-cert.der"
          python3 .github/scripts/configure_android_release.py
      - name: Select preview version without blocking the next stable update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stable-metadata"
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir "$RUNNER_TEMP/stable-metadata"
          code=$(jq -er '.versionCode | select(type == "number" and . > 0 and . == floor)' "$RUNNER_TEMP/stable-metadata/update.json")
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${tag#v}-preview.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=preview-$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/quadrinheiro-release.p12
          KEYSTORE_TYPE: PKCS12
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          set -euo pipefail
          node --test catalog-service/test/*.test.cjs
          gradle :app:tasks --all --no-daemon --console=plain > "$RUNNER_TEMP/tasks.txt"
          task=$(awk '$1 ~ /^testRelease(UnitTest|HostTest)$/ {print $1; exit}' "$RUNNER_TEMP/tasks.txt")
          if [ -z "$task" ]; then task=$(awk '$1 ~ /^testDebug(UnitTest|HostTest)$/ {print $1; exit}' "$RUNNER_TEMP/tasks.txt"); fi
          test -n "$task"
          firebase emulators:exec --project demo-no-project --config firebase.ci.json --only auth,firestore --non-interactive "gradle :app:$task :app:assembleRelease -PreleaseVersionCode=$VERSION_CODE -PreleaseVersionName=$VERSION_NAME --no-daemon --console=plain"
      - name: Verify signed APK and publish preview only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Preview verification or publication failed at line $LINENO (exit $?)."' ERR
          mkdir -p dist ci-reports
          cp app/build/outputs/apk/release/app-release.apk dist/quadrinheiro.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer" || { echo '::error::apksigner not found'; exit 1; }
          "$signer" verify --verbose --print-certs dist/quadrinheiro.apk 2>&1 | tee ci-reports/apk-verification.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          report = Path('ci-reports/apk-verification.txt').read_text()
          expected = Path('docs/release-signing-sha256.txt').read_text().strip().lower()
          def fail(message):
              raise SystemExit('::error::' + message)
          if not re.fullmatch(r'[a-f0-9]{64}', expected):
              fail('Invalid pinned signing certificate fingerprint')
          counts = re.findall(r'^Number of signers:\s*(\d+)\s*$', report, re.M)
          if counts != ['1']:
              fail('APK must have exactly one verified signer; found ' + repr(counts))
          fingerprints = {value.lower() for value in re.findall(r'^(?:Signer #\d+|V\d+(?:\.\d+)* Signer): certificate SHA-256 digest:\s*([0-9a-fA-F]{64})\s*$', report, re.M)}
          if fingerprints != {expected}:
              fail('APK certificate missing, unrecognized, or different from the permanent signing key')
          print('Verified APK signature and permanent signing certificate.')
          PY
          (cd dist && sha256sum quadrinheiro.apk > SHA256SUMS.txt)
          printf 'Versão para teste no aparelho. Commit: %s\nTestes automatizados executados antes da publicação. Testes instrumentados/Samsung e implantação Cloudflare não confirmados. Não é a versão estável. Sem manifesto de atualização automática.\n' "$GITHUB_SHA" > dist/NOTES.txt
          gh release create "$RELEASE_TAG" dist/quadrinheiro.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Quadrinheiro $VERSION_NAME - teste" --prerelease --latest=false --notes-file dist/NOTES.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-diagnostics-${{ github.run_number }}
          path: |
            ci-reports/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Remove temporary secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/quadrinheiro-release.p12" "$RUNNER_TEMP/release-cert.der" app/google-services.json
