name: Apply app fixes and audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fixes.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply guarded patches and audit
        run: |
          python3 .github/scripts/apply_patches.py
          python3 .github/scripts/apply_patches_2.py
          python3 .github/scripts/audit_more.py
          python3 .github/scripts/audit_more2.py
          if [ -f .github/scripts/apply_patches_3.py ]; then python3 .github/scripts/apply_patches_3.py; fi
          python3 .github/scripts/polish_glass_controls.py
      - name: Resolve Gradle version
        id: gv
        run: |
          v=$(grep -oP 'gradle-\K[0-9.]+(?=-)' gradle/wrapper/gradle-wrapper.properties 2>/dev/null | head -1 || true)
          echo "v=${v:-8.9}" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.v }}
      - name: Compile check (non-blocking)
        continue-on-error: true
        run: |
          mkdir -p .audit
          timeout 1500 gradle :app:compileDebugKotlin --no-daemon --console=plain > build_full.log 2>&1 || true
          grep -E '^e: |What went wrong|error:|BUILD' build_full.log | head -80 > .audit/build_errors.txt || true
          tail -5 build_full.log > .audit/build_tail.txt || true
          rm -f build_full.log
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src .audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update audit report and apply patches'
          git pull --rebase origin main
          git push origin HEAD:main
