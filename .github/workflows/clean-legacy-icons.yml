name: Apply total fix for launcher icon, typography and crashes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/clean_legacy_icons_and_fix.py'
      - '.github/workflows/clean-legacy-icons.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: clean-legacy-icons-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: ./.github/actions/setup-firebase
      - name: Clean legacy icons, apply typography and eliminate crashes
        run: python3 .github/scripts/clean_legacy_icons_and_fix.py
      - name: Run unit tests and compilation with isolated Firebase
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          firebase emulators:exec --project demo-no-project --config firebase.ci.json --only auth,firestore --non-interactive "gradle :app:testDebugUnitTest :app:compileDebugKotlin --no-daemon --console=plain"
      - name: Commit cleanups and fixes
        id: commit
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'fix: remove legacy mipmap PNGs, bind direct SF Pro font resource, eliminate shape crash and align social logo'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Trigger release APK build after successful patch
        if: steps.commit.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-apk.yml --ref main
